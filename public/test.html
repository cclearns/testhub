<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đang làm bài</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="examhead">
  <h1 id="title">Đang tải…</h1>
  <span id="timer" class="timer hidden"></span>
  <button class="sm ghost hidden" id="exit">Thoát</button>
</header>

<div class="wrap">
  <div id="info" class="hidden"></div>
  <div id="body"></div>

  <div id="footer" class="card hidden">
    <div class="row" id="submitRow">
      <span class="muted small grow" id="progress"></span>
      <button class="primary" id="submit">Nộp bài</button>
    </div>

    <!-- Xác nhận ngay trong trang: không phụ thuộc hộp thoại của trình duyệt -->
    <div id="confirmBox" class="notice hidden" style="margin-top:var(--space-md)">
      <p id="confirmText" style="margin-bottom:var(--space-sm)"></p>
      <div class="row">
        <button class="primary" id="confirmYes">Nộp bài</button>
        <button id="confirmNo">Quay lại làm tiếp</button>
      </div>
    </div>

    <div id="submitErr" class="notice err hidden" style="margin-top:var(--space-md)">
      <p id="submitErrText" style="margin-bottom:var(--space-sm)"></p>
      <div class="row">
        <button class="primary" id="retry">Thử nộp lại</button>
        <span class="small">Câu trả lời của bạn vẫn được giữ nguyên trên trang này.</span>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<div id="exitBox" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
  <div class="panel">
    <h3 id="exitTitle">Thoát khỏi bài thi?</h3>
    <p class="muted">Những câu đã làm nhưng chưa nộp sẽ không được lưu.</p>
    <div class="row">
      <button class="primary" id="exitNo">Ở lại làm bài</button>
      <button class="danger" id="exitYes">Thoát, không nộp</button>
    </div>
  </div>
</div>

<footer class="colophon">
  <span class="mark">Phòng thi</span>
  <span>Giữ trang này mở cho tới khi nộp bài.</span>
</footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
const testId = new URLSearchParams(location.search).get('id');
const student = JSON.parse(sessionStorage.getItem('student') || '{}');
if (!student.name) location.href = 'index.html';

const answers = {};      // qid -> đáp án
const audioPlays = {};   // sectionId -> số lần đã nghe
let test = null, submitId = null, startedAt = new Date().toISOString(),
    deadline = null, timerInt = null, submitted = false, remainingSec = 0;

/* ---------- bản nháp giữ trong máy ----------
   Cả lượt làm bài — đề đã nhận, mốc bắt đầu, hạn nộp, câu đã làm, số lượt đã
   nghe — được ghi vào localStorage sau mỗi thay đổi. Lỡ tải lại trang, trình
   duyệt điện thoại đóng tab nền, hay mất mạng giữa chừng thì mở lại vẫn làm tiếp
   từ chỗ đang dở: cùng submitId nên nộp vẫn tính là một bài, và đồng hồ đếm theo
   hạn nộp cũ chứ không được cấp thêm giờ. Nháp bị xoá khi nộp xong hoặc khi học
   viên chủ động thoát. (Đề lưu ở đây là bản đã bỏ đáp án — không lộ thêm gì.) */
const draftKey = 'bai_' + testId;
const clearDraft = () => { try { localStorage.removeItem(draftKey); } catch { /* trình duyệt chặn */ } };
const saveDraft = () => {
  if (!test || submitted) return;
  try {
    localStorage.setItem(draftKey, JSON.stringify({ test, submitId, startedAt, deadline, answers, audioPlays }));
  } catch { /* hết chỗ hoặc chế độ riêng tư — vẫn làm bài bình thường được */ }
};
const loadDraft = () => {
  let d;
  try { d = JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch { return null; }
  if (!d || !d.test) return null;
  /* Hết giờ rồi (hoặc đề không giới hạn giờ nhưng bỏ dở quá 12 tiếng) thì coi như
     lượt cũ đã khép lại — bỏ nháp, mở bài mới. */
  const conHan = d.deadline
    ? Date.parse(d.deadline) > Date.now()
    : Date.now() - Date.parse(d.startedAt) < 12 * 60 * 60 * 1000;
  if (!conHan) { clearDraft(); return null; }
  return d;
};

const draft = loadDraft();
fetch('/api/tests/' + testId).then(r => r.json()).catch(() => null).then(t => {
  if (!t) {
    /* Mất mạng đúng lúc mở lại trang: còn nháp thì vẫn làm tiếp được, nộp sau. */
    if (draft) return begin(draft);
    $('body').innerHTML = '<div class="card notice err">Không tải được đề. Kiểm tra kết nối rồi tải lại trang.</div>';
    return;
  }
  /* Đề bị xoá hoặc bị đóng giữa chừng: báo lỗi, kể cả khi máy còn nháp. */
  if (t.error) { $('body').innerHTML = `<div class="card notice err">${esc(t.error)}</div>`; return; }
  begin(draft || {
    /* submitId + mốc bắt đầu đều do máy chủ phát: tránh nộp trùng, và tính độ
       muộn theo đồng hồ máy chủ chứ không theo đồng hồ thiết bị. */
    test: t, submitId: t.submitId || null,
    startedAt: t.startedAt || new Date().toISOString(), deadline: t.deadline || null,
  });
});

function begin(state) {
  test = state.test;
  submitId = state.submitId;
  startedAt = state.startedAt;
  deadline = state.deadline
    || (test.timeLimitMin ? new Date(Date.now() + test.timeLimitMin * 60000).toISOString() : null);
  Object.assign(answers, state.answers || {});
  Object.assign(audioPlays, state.audioPlays || {});
  render();
  if (state === draft) $('info').insertAdjacentHTML('beforeend',
    '<p class="notice">Đã khôi phục bài làm dở của bạn — đồng hồ vẫn tính từ lúc bắt đầu.</p>');
}

function render() {
  $('title').textContent = test.title;
  $('info').classList.remove('hidden');
  $('info').innerHTML = `
    ${test.description ? `<p class="lede">${esc(test.description)}</p>` : ''}
    <p class="small muted">Thí sinh: <strong>${esc(student.name)}</strong></p>`;

  $('body').innerHTML = test.sections.map(renderSection).join('');
  $('footer').classList.remove('hidden');
  wire();
  restoreAnswers();
  updateProgress();

  /* Đếm ngược theo đồng hồ máy chủ (deadline) thay vì trình duyệt. */
  if (deadline) startTimer(deadline);

  $('submit').onclick = () => {
    const left = test.sections.flatMap(s => s.questions).filter(q => !isAnswered(q)).length;
    if (!left) return submit();
    $('confirmText').textContent =
      `Bạn còn ${left} câu chưa làm. Nộp bài bây giờ thì những câu đó tính 0 điểm.`;
    $('confirmBox').classList.remove('hidden');
    $('submit').disabled = true;
    $('confirmYes').focus();
  };
  $('confirmNo').onclick = () => {
    $('confirmBox').classList.add('hidden');
    $('submit').disabled = false;
  };
  $('confirmYes').onclick = () => { $('confirmBox').classList.add('hidden'); submit(); };
  $('retry').onclick = () => { $('submitErr').classList.add('hidden'); submit(); };

  /* Thoát giữa chừng */
  $('exit').classList.remove('hidden');
  $('exit').onclick = () => {
    $('exitBox').classList.remove('hidden');
    $('exitNo').focus();
  };
  $('exitNo').onclick = () => $('exitBox').classList.add('hidden');
  $('exitBox').onclick = (e) => { if (e.target.id === 'exitBox') $('exitNo').click(); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('exitBox').classList.contains('hidden')) $('exitNo').click();
  });
  $('exitYes').onclick = () => { submitted = true; clearDraft(); location.href = 'index.html'; };
}

function renderSection(s) {
  const audio = s.audio && s.audio.url ? `
    <div class="audio-box" data-section="${s.id}">
      <div class="row">
        <button type="button" class="play primary">Phát bài nghe</button>
        <span class="small">Còn <strong class="plays">${s.audio.maxPlays || 1}</strong> lượt nghe</span>
      </div>
      <p class="small muted" style="margin-top:var(--space-xs)">Không tua được. Hết lượt, nút phát sẽ khoá.</p>
      <audio class="au" src="${esc(s.audio.url)}" preload="auto"></audio>
    </div>` : '';
  const passage = s.passage ? `<div class="passage">${formatPassage(s.passage)}</div>` : '';
  return `<div class="card">
    <h2>${esc(s.title || 'Phần thi')}</h2>
    ${s.instructions ? `<p class="muted small">${esc(s.instructions)}</p>` : ''}
    ${audio}${passage}
    ${s.questions.map((q, i) => renderQuestion(q, i + 1)).join('')}
  </div>`;
}

/* Bài đọc: xuống dòng đơn trong tệp nguồn chỉ là chỗ ngắt dòng khi soạn thảo,
   không phải ngắt dòng thật — gộp lại thành đoạn văn chảy tự nhiên.
   Dòng trống (hoặc dòng bắt đầu bằng "A:", "B:" trong hội thoại) mới tách đoạn. */
function formatPassage(text) {
  const isDialogue = /^\s*[A-ZĐ][\wÀ-ỹ ]{0,14}:\s/m.test(text);
  const paragraphs = String(text)
    .split(/\n\s*\n/)
    .map(block => isDialogue
      ? block.split('\n').map(l => l.trim()).filter(Boolean)
          .reduce((lines, line) => {
            if (/^[A-ZĐ][\wÀ-ỹ ]{0,14}:\s/.test(line)) lines.push(line);
            else if (lines.length) lines[lines.length - 1] += ' ' + line;
            else lines.push(line);
            return lines;
          }, [])
      : [block.split('\n').map(l => l.trim()).join(' ')])
    .flat()
    .filter(Boolean);
  return paragraphs.map(p => `<p>${esc(p)}</p>`).join('');
}

function renderQuestion(q, n) {
  const head = `<div class="prompt">Câu ${n}. ${esc(q.prompt)} <span class="muted small">(${q.points || 1} điểm)</span></div>`;
  let body = '';
  switch (q.type) {
    case 'multiple_choice': {
      const type = q.multiple ? 'checkbox' : 'radio';
      body = (q.options || []).map(o => `<label class="opt">
        <input type="${type}" name="q_${q.id}" value="${o.id}" data-q="${q.id}" data-kind="mc">
        <span>${esc(o.text)}</span></label>`).join('')
        + (q.multiple ? '<p class="small muted">Có thể chọn nhiều đáp án.</p>' : '');
      break;
    }
    case 'true_false':
      body = ['true', 'false'].map(v => `<label class="opt">
        <input type="radio" name="q_${q.id}" value="${v}" data-q="${q.id}" data-kind="tf">
        <span>${v === 'true' ? 'Đúng' : 'Sai'}</span></label>`).join('');
      break;
    case 'fill_blank': {
      const n = (q.blanks || []).length || (q.prompt.match(/_{2,}/g) || []).length || 1;
      let i = 0;
      const text = esc(q.text || q.prompt).replace(/_{2,}/g, () =>
        `<input type="text" class="blank" data-q="${q.id}" data-kind="fb" data-i="${i++}">`);
      body = `<div>${i ? text : Array.from({ length: n }, (_, k) =>
        `<input type="text" class="blank" data-q="${q.id}" data-kind="fb" data-i="${k}" placeholder="Chỗ trống ${k + 1}">`).join(' ')}</div>`;
      break;
    }
    case 'short_answer':
      body = `<input type="text" data-q="${q.id}" data-kind="sa" placeholder="Câu trả lời của bạn">`;
      break;
    case 'essay':
      body = `<textarea data-q="${q.id}" data-kind="sa" rows="6" placeholder="Viết bài của bạn tại đây"></textarea>`;
      break;
    case 'matching':
      body = (q.left || []).map(l => `<div class="row" style="margin-bottom:6px">
        <span class="grow">${esc(l.text)}</span>
        <select data-q="${q.id}" data-kind="match" data-left="${l.id}" style="max-width:280px">
          <option value="">— chọn —</option>
          ${(q.right || []).map(r => `<option value="${r.id}">${esc(r.text)}</option>`).join('')}
        </select></div>`).join('');
      break;
    case 'ordering':
      body = `<div class="order" data-q="${q.id}">` + (q.items || []).map((it, i) =>
        `<div class="dragitem" data-id="${it.id}">
           <span class="ord">${i + 1}</span><span class="grow">${esc(it.text)}</span>
           <button type="button" class="sm ghost up">↑</button>
           <button type="button" class="sm ghost down">↓</button>
         </div>`).join('') + '</div><p class="small muted">Dùng ↑ ↓ để sắp xếp đúng thứ tự.</p>';
      break;
    default:
      body = '<p class="muted small">Dạng câu hỏi không hỗ trợ.</p>';
  }
  return `<div class="q" id="qq_${q.id}">${head}${body}</div>`;
}

function wire() {
  // câu trả lời
  document.querySelectorAll('[data-kind]').forEach(el => {
    const q = el.dataset.q, kind = el.dataset.kind;
    const handler = () => {
      if (kind === 'mc') {
        const boxes = [...document.querySelectorAll(`input[name="q_${q}"]:checked`)].map(x => x.value);
        answers[q] = boxes;
      } else if (kind === 'tf') {
        answers[q] = el.value;
      } else if (kind === 'fb') {
        const arr = answers[q] || [];
        arr[Number(el.dataset.i)] = el.value;
        answers[q] = arr;
      } else if (kind === 'sa') {
        answers[q] = el.value;
      } else if (kind === 'match') {
        const m = answers[q] || {};
        m[el.dataset.left] = el.value;
        answers[q] = m;
      }
      updateProgress();
    };
    el.addEventListener('change', handler);
    el.addEventListener('input', handler);
  });

  // sắp xếp thứ tự
  document.querySelectorAll('.order').forEach(box => {
    const sync = () => {
      [...box.children].forEach((c, i) => c.querySelector('.ord').textContent = i + 1);
      answers[box.dataset.q] = [...box.children].map(c => c.dataset.id);
      updateProgress();
    };
    box.addEventListener('click', e => {
      const item = e.target.closest('.dragitem'); if (!item) return;
      if (e.target.classList.contains('up') && item.previousElementSibling)
        box.insertBefore(item, item.previousElementSibling);
      else if (e.target.classList.contains('down') && item.nextElementSibling)
        box.insertBefore(item.nextElementSibling, item);
      else return;
      sync();
    });
  });

  // bài nghe: giới hạn số lần phát, không cho tua
  document.querySelectorAll('.audio-box').forEach(box => {
    const sid = box.dataset.section;
    const section = test.sections.find(s => s.id === sid);
    const au = box.querySelector('.au');
    const btn = box.querySelector('.play');
    const left = box.querySelector('.plays');
    /* Nghe dở rồi tải lại trang thì không được cấp lại lượt: trừ số lần đã nghe. */
    audioPlays[sid] = audioPlays[sid] || 0;
    let remaining = Math.max(0, (section.audio.maxPlays || 1) - audioPlays[sid]);
    left.textContent = remaining;
    if (remaining <= 0) { btn.disabled = true; btn.textContent = 'Đã hết lượt nghe'; }

    btn.onclick = () => {
      if (remaining <= 0) return;
      remaining--; audioPlays[sid]++;
      left.textContent = remaining;
      saveDraft();
      btn.disabled = true; btn.textContent = 'Đang phát…';
      au.currentTime = 0; au.play();
    };
    au.onended = () => {
      btn.textContent = remaining > 0 ? 'Nghe lại' : 'Đã hết lượt nghe';
      btn.disabled = remaining <= 0;
    };
    au.onerror = () => { btn.disabled = true; btn.textContent = 'Không tải được tệp âm thanh'; };
  });
}

/* Đổ câu trả lời đã lưu (từ nháp) ngược lại vào các ô trên trang. */
function restoreAnswers() {
  document.querySelectorAll('[data-kind]').forEach(el => {
    const a = answers[el.dataset.q];
    if (a == null) return;
    switch (el.dataset.kind) {
      case 'mc': el.checked = [].concat(a).includes(el.value); break;
      case 'tf': el.checked = String(a) === el.value; break;
      case 'fb': el.value = a[Number(el.dataset.i)] || ''; break;
      case 'sa': el.value = a; break;
      case 'match': el.value = a[el.dataset.left] || ''; break;
    }
  });
  document.querySelectorAll('.order').forEach(box => {
    const order = answers[box.dataset.q];
    if (!Array.isArray(order)) return;
    const byId = new Map([...box.children].map(c => [c.dataset.id, c]));
    order.forEach(id => { const it = byId.get(id); if (it) box.appendChild(it); });
    [...box.children].forEach((c, i) => c.querySelector('.ord').textContent = i + 1);
  });
}

function isAnswered(q) {
  const a = answers[q.id];
  if (a == null) return false;
  if (Array.isArray(a)) return a.some(x => x !== undefined && String(x).trim() !== '');
  if (typeof a === 'object') return Object.values(a).some(v => v);
  return String(a).trim() !== '';
}

function updateProgress() {
  const qs = test.sections.flatMap(s => s.questions);
  const done = qs.filter(isAnswered).length;
  $('progress').textContent = `Đã làm ${done}/${qs.length} câu`;
  saveDraft();
}

function startTimer(deadline) {
  clearInterval(timerInt);
  const el = $('timer'); el.classList.remove('hidden');
  const end = Date.parse(deadline);
  const tick = () => {
    remainingSec = Math.round((end - Date.now()) / 1000);
    let sec = remainingSec < 0 ? 0 : remainingSec;
    const m = Math.floor(sec / 60), s = sec % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')}`;
    el.classList.toggle('low', sec <= 60);
    if (sec <= 0) {
      clearInterval(timerInt);
      el.textContent = 'Hết giờ';
      $('confirmBox').classList.add('hidden');
      submit();
    }
  };
  /* Gán timerInt TRƯỚC khi gọi tick: nếu tick đầu tiên đã thấy hết giờ, lệnh
     clearInterval bên trong nó mới xoá đúng đồng hồ vừa tạo — trước đây nó xoá
     đồng hồ cũ rồi setInterval bên dưới vẫn chạy, làm bài tự nộp thêm một lần. */
  timerInt = setInterval(tick, 1000); tick();
}

async function submit() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInt);
  $('submitErr').classList.add('hidden');
  $('submit').disabled = true;
  $('submit').textContent = 'Đang nộp…';

  const fail = (msg) => {
    /* Mở khoá để học viên nộp lại — bài làm vẫn nằm nguyên trong trang. */
    submitted = false;
    $('submit').disabled = false;
    $('submit').textContent = 'Nộp bài';
    $('submitErrText').textContent = msg;
    $('submitErr').classList.remove('hidden');
    /* Chỉ chạy lại đồng hồ khi CÒN giờ. Nộp hỏng đúng lúc hết giờ mà vẫn khởi
       động lại thì tick đầu tiên thấy quá hạn sẽ gọi submit() ngay — hỏng tiếp,
       rồi lại chạy đồng hồ: trang tự nộp lại vô hạn cho tới khi có mạng. */
    if (deadline && Date.parse(deadline) > Date.now()) startTimer(deadline);
  };

  let r;
  try {
    const resp = await fetch('/api/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        testId, studentName: student.name,
        answers, startedAt, audioPlays, submitId,
        durationSec: Math.round((Date.now() - new Date(startedAt)) / 1000),
      }),
    });
    r = await resp.json();
  } catch {
    return fail('Không gửi được bài — có vẻ mất kết nối tới máy chủ. Kiểm tra mạng rồi bấm “Thử nộp lại”.');
  }
  if (!r || r.error) return fail(r && r.error ? r.error : 'Máy chủ trả về dữ liệu không hợp lệ.');
  showResult(r);
}

function showResult(r) {
  clearDraft();   /* nộp xong thì bỏ nháp — lần sau mở đề là một lượt mới */
  $('body').classList.add('hidden');
  $('footer').classList.add('hidden');
  $('timer').classList.add('hidden');
  $('exitBox').classList.add('hidden');
  $('exit').classList.add('hidden');
  const lateNote = r.late
    ? `<div class="notice err"><strong>Bài của bạn bị tính là muộn</strong> — nộp khi đã hết giờ (+thời gian cho phép). Máy chủ vẫn chấp nhận và chấm bài.</div>`
    : '';
  const detail = r.key ? `<div class="card"><h3>Đáp án</h3>${r.key.map(k => {
    const d = r.details[k.id] || {};
    const mark = d.correct === true ? '<span class="correct">✔ Đúng</span>'
      : d.correct === false ? '<span class="wrong">✘ Sai</span>'
      : '<span class="review">Chờ giáo viên chấm</span>';
    return `<div class="q"><div class="prompt">${esc(k.prompt)} — ${mark}
      <span class="muted small">(${d.earned ?? 0}/${d.max ?? 0} điểm)</span></div>
      ${keyText(k)}${k.explanation ? `<p class="small muted">Giải thích: ${esc(k.explanation)}</p>` : ''}</div>`;
  }).join('')}</div>` : '';

  $('result').innerHTML = `
    <div class="card">
      ${lateNote}
      <p class="small muted">Kết quả của ${esc(student.name)}</p>
      <div class="stat-row">
        <div class="stat"><div class="label">Điểm</div><div class="figure">${r.score}<span class="muted" style="font-size:.5em">/${r.maxScore}</span></div></div>
        <div class="stat"><div class="label">Tỉ lệ đúng</div><div class="figure">${r.percent}%</div></div>
      </div>
      <p class="muted">${r.needsReview
        ? 'Một số câu cần giáo viên chấm tay — điểm ở trên là phần chấm tự động.'
        : 'Bài đã được chấm xong.'} Kết quả đã lưu lại cho giáo viên.</p>
      <div class="row">
        <a href="index.html"><button class="primary">Về trang chủ</button></a>
        ${r.key ? '<span class="small muted">Đáp án chi tiết ở ngay bên dưới.</span>' : ''}
      </div>
    </div>${detail}
    <div class="card" style="text-align:center">
      <a href="index.html"><button>Về trang chủ</button></a>
    </div>`;
  window.scrollTo(0, 0);
}

function keyText(k) {
  if (k.type === 'multiple_choice')
    return `<p class="small muted">Đáp án đúng: ${esc([].concat(k.correct || [])
      .map(id => ((k.options || []).find(o => o.id === id) || {}).text || id).join(', '))}</p>`;
  if (k.type === 'true_false')
    return `<p class="small muted">Đáp án đúng: ${k.correct === 'true' ? 'Đúng' : 'Sai'}</p>`;
  if (k.type === 'matching')
    return `<p class="small muted">Đáp án: ${esc(Object.entries(k.pairs || {}).map(([l, r]) =>
      `${((k.left || []).find(x => x.id === l) || {}).text} → ${((k.right || []).find(x => x.id === r) || {}).text}`).join('; '))}</p>`;
  if (k.type === 'fill_blank')
    return `<p class="small muted">Đáp án: ${(k.blanks || []).map(b => esc((b.answers || []).join(' / '))).join(' | ')}</p>`;
  if (k.type === 'short_answer')
    return `<p class="small muted">Đáp án: ${esc((k.answers || []).join(' / '))}</p>`;
  if (k.type === 'ordering')
    return `<p class="small muted">Thứ tự đúng: ${(k.items || []).map(i => esc(i.text)).join(' → ')}</p>`;
  return '';
}
</script>
