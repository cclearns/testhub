<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bàn làm việc của giáo viên</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="bar">
    <h1 class="wordmark">Ra đề &amp; chấm bài</h1>
    <nav class="links">
    <button class="hidden" id="navTests">Ngân hàng đề</button>
    <button class="hidden" id="navSubs">Kết quả</button>
    <a href="index.html">Trang học viên</a>
      <button class="hidden" id="logout">Đăng xuất</button>
    </nav>
  </div>
</header>

<div class="wrap wide">
  <!-- Đăng nhập -->
  <div id="loginView" style="max-width:24rem;margin:var(--space-3xl) auto">
    <h2>Đăng nhập</h2>
    <p class="muted small">Khu vực này chỉ dành cho giáo viên phụ trách.</p>
    <label class="field" style="margin-top:var(--space-lg)"><span>Mật khẩu</span>
      <input type="password" id="pw" autocomplete="current-password"></label>
    <button class="primary" id="loginBtn">Đăng nhập</button>
    <p id="loginErr" class="notice err hidden" style="margin-top:var(--space-md)"></p>
  </div>

  <div id="app" class="hidden">
    <!-- Danh sách bài test -->
    <div id="testsView">
      <div class="row" style="margin-bottom:var(--space-lg)">
        <h2 class="grow">Ngân hàng đề</h2>
        <button id="importBtn">Nhập đề từ Markdown</button>
        <button class="primary" id="newTest">Soạn đề mới</button>
      </div>
      <div id="testList" class="index-list"></div>
    </div>

    <!-- Nhập đề từ Markdown -->
    <div id="importView" class="hidden"></div>

    <!-- Trình soạn đề -->
    <div id="editView" class="hidden"></div>

    <!-- Kết quả -->
    <div id="subsView" class="hidden"></div>
  </div>
</div>

<footer class="colophon">
  <span class="mark">Bàn làm việc</span>
  <span>Đề và kết quả lưu trên máy chủ của lớp.</span>
</footer>

<script src="mdimport.js"></script>
<script src="admin.js"></script>
</body>
</html>
